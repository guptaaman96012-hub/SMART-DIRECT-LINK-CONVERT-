<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Direct Link Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef1f7">

<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

/* ================= BODY ================= */
body{
  min-height:100vh;
  background:#eef1f7;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= CARD ================= */
.app{
  width:92%;
  max-width:420px;
  background:#eef1f7;
  border-radius:26px;
  padding:28px;
  box-shadow:
    8px 8px 18px #cfd6e3,
   -8px -8px 18px #ffffff;
}

/* ================= TITLE ================= */
h1{
  font-size:22px;
  font-weight:600;
  color:#2b2f38;
  margin-bottom:6px;
}
p{
  font-size:13px;
  color:#7c8395;
  margin-bottom:22px;
}

/* ================= INPUT ================= */
label{
  font-size:12px;
  color:#7a8194;
}
input{
  width:100%;
  margin-top:8px;
  padding:14px 16px;
  border-radius:16px;
  border:none;
  background:#eef1f7;
  box-shadow:
    inset 6px 6px 10px #cfd6e3,
    inset -6px -6px 10px #ffffff;
  outline:none;
  font-size:14px;
}

/* ================= BUTTONS ================= */
.btn{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:none;
  border-radius:18px;
  background:#eef1f7;
  font-size:15px;
  font-weight:600;
  color:#356dff;
  cursor:pointer;
  box-shadow:
    6px 6px 12px #cfd6e3,
   -6px -6px 12px #ffffff;
}
.btn:active{
  box-shadow:
    inset 6px 6px 12px #cfd6e3,
    inset -6px -6px 12px #ffffff;
}

/* ================= RESULT ================= */
.result{
  margin-top:20px;
  display:none;
}
.result input{
  font-size:13px;
}
.small{
  margin-top:10px;
  font-size:11px;
  color:#8a91a3;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">
  <h1>Smart Direct Link</h1>
  <p>Paste any social media link and generate a smart app-opening link</p>

  <label>Paste your link</label>
  <input id="inputURL" placeholder="https://youtu.be/xxxx">

  <button class="btn" onclick="generateLink()">Generate Smart Link</button>

  <div class="result" id="resultBox">
    <label>Generated Direct Link</label>
    <input id="outputURL" readonly>

    <button class="btn" onclick="copyLink()">Copy Link</button>
    <button class="btn" onclick="openSmart()">Test Open Now</button>

    <div class="small">This link will try to open the app first</div>
  </div>
</div>

<script>
/* ================= GENERATE ================= */
function generateLink(){
  let input = document.getElementById("inputURL").value.trim();
  if(!input){
    alert("Please paste a link");
    return;
  }
  let smart = location.origin + location.pathname + "?redirect=" + encodeURIComponent(input);
  document.getElementById("outputURL").value = smart;
  document.getElementById("resultBox").style.display = "block";
}

/* ================= COPY ================= */
function copyLink(){
  let out = document.getElementById("outputURL");
  out.select();
  document.execCommand("copy");
  alert("Smart link copied");
}

/* ================= OPEN ================= */
function openSmart(){
  window.location.href = document.getElementById("outputURL").value;
}

/* ================= AUTO REDIRECT MODE ================= */
(function(){
  let params = new URLSearchParams(location.search);
  let original = params.get("redirect");
  if(!original) return;

  let app = original;

  if(original.includes("youtube")){
    let id = original.includes("v=")
      ? original.split("v=")[1].split("&")[0]
      : original.split("/").pop();
    app = "youtube://www.youtube.com/watch?v=" + id;
  }
  else if(original.includes("instagram")){
    app = "instagram://app";
  }
  else if(original.includes("facebook")){
    app = "fb://facewebmodal/f?href=" + original;
  }
  else if(original.includes("t.me")){
    app = "tg://resolve?domain=" + original.split("/").pop();
  }
  else if(original.includes("whatsapp")){
    app = "whatsapp://send?text=" + encodeURIComponent(original);
  }

  setTimeout(()=>{ location.href = app; },300);
  setTimeout(()=>{ location.href = original; },1500);
})();
</script>

</body>
</html>
